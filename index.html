<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Azaruses Wiki</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #e91e63;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #f48fb1;
            margin-bottom: 10px;
        }
        p {
            color: #b0bec5;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>BH Azarus</h1>
        <p>"A person of true distinction maintains their grace, even when the script unravels."</p>
    </div>
</body>
</html>
