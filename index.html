<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaruses</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin-bottom: 40px;
        }
        /* THE END OF THE BACKGROUND. DO. NOT. TOUCH. */




        /* CHARACTERS CONTAINERS ARE HERE */
        .character-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

/* CARD OF THE CHARACTERS ARE HERE */
        .char-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #1a1a1a;
            width: 200px;
            padding: 0;                   /* Bỏ khoảng trống bên trong */
            border-radius: 0;            /* Bỏ bo góc khung ngoài */
            border: none;                /* BỎ VIỀN KHUNG */
            background-color: transparent;/* BỎ NỀN TRẮNG */
            box-shadow: none;            /* BỎ BÓNG MỜ KHUNG */
            transition: all 0.3s ease;
        }

        /* PICTURE IN CARD */
        .img-box {
            width: 100%;                 /* Cho khung ảnh tự co giãn theo chiều rộng card */
            height: auto;                /* Cho chiều cao tự do theo tỉ lệ ảnh Polaroid */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
            border-radius: 0;
        }

        .char-img {
            width: 100%;                 /* Ảnh tự ôm trọn 100% độ rộng */
            height: auto;                /* Giữ nguyên tỉ lệ dọc của ảnh Polaroid */
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* CHARACTERS NAME BOTTOM */
        .char-title {
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #121212;
        }

        /* HOVER. HOVER. HOVER */
        .char-card:hover {
            border-color: transparent;   /* Không hiện viền khi rê chuột */
            box-shadow: none;            /* Không hiện bóng khi rê chuột */
            transform: translateY(-4px); /* Vẫn nẩy nhẹ card lên cực mượt */
        }
        
        .char-card:hover .char-img {
            transform: scale(1.05);      /* Phóng to nhẹ riêng bức ảnh */
        }

        
        
        /* AZARUS HOVER DO. NOT. TOUCH. */
        .img-hov {
            display: none;
        }
        /* Khi rê chuột vào card Azarus: Ẩn ảnh normal, Hiện ảnh hover */
        .azarus-card:hover .img-nor {
            display: none;
        }
        
        .azarus-card:hover .img-hov {
            display: block;
        }

        
        /* BH AZARUS HOVER DO. NOT. TOUCH. */
        .bh-card:hover {
            border-color: #ffb7c5;
        }
        .bh-card:hover .char-title {
            color: #ffb7c5;
        }

        
        /* VOID AZARUS HOVER DO. NOT. TOUCH. */
        .void-card:hover {
            border-color: #080502;
        }
        .void-card:hover .char-title {
            color: #080502;
        }
    </style>
</head>




    
<body>

    <h1>Azaruses</h1>
    <p class="subtitle">Unofficial Wiki & Lore Books</p>
    <hr>

    <div class="character-container">
        <!-- ==================== AZARUS ==================== -->
        <a href="./azarus.html" class="char-card azarus-card" title="Khám phá Azarus">
            <div class="img-box">
                <img src="./aza_nor.png" alt="Azarus Normal" class="char-img img-nor">
                <img src="./aza_hov.png" alt="Azarus Hover" class="char-img img-hov">
            </div>
            <span class="char-title">Azarus 🍞</span>
        </a>        
        <!-- ==================== BH AZARUS ==================== -->
        <a href="./bh-azarus.html" class="char-card bh-card" title="Learn More ABout BH Azarus">
            <div class="img-box">
                <img src="./sb.jpg" alt="BH Azarus 🌸" class="char-img">
            </div>
            <span class="char-title">BH Azarus 🌸</span>
        </a>
        
        <!-- ==================== AZARUS ==================== -->
        <a href="./void-azarus.html" class="char-card void-card" title="Learn More ABout Void Azarus">
            <div class="img-box">
                <img src="./sb.jpg" alt="VOID Azarus ☠️" class="char-img">
            </div>
            <span class="char-title">VOID Azarus ☠️</span>
        </a>
    </div>

</body>
</html>
