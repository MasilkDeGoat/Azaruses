<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaruses</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin-bottom: 40px;
        }
        /* THE END OF THE BACKGROUND. DO. NOT. TOUCH. */




        /* CHARACTERS CONTAINERS ARE HERE */
        .character-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* CARD OF THE CHARACTERS ARE HERE */
        .char-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #1a1a1a;
            width: 200px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e5e5e5;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        /* PICTURE IN CARD */
        .img-box {
            width: 170px;
            height: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 8px;
        }

        .char-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* CHARACTERS NAME BOTTOM */
        .char-title {
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #121212;
        }

        /* HOVER. HOVER. HOVER */
        .char-card:hover {
            border-color: #E9BD96;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            transform: translateY(-4px);
        }
        .char-card:hover .char-img {
            transform: scale(1.08);
        }

        /* AZARUS HOVER DO. NOT. TOUCH. */
        .char-card:hover .char-title {
            color: #e9bd96
        }  
        
        /* BH AZARUS HOVER DO. NOT. TOUCH. */
        .bh-card:hover {
            border-color: #ffb7c5;
        }
        .bh-card:hover .char-title {
            color: #ffb7c5;
        }
    </style>
</head>




    
<body>

    <h1>Azaruses</h1>
    <p class="subtitle">Unofficial Wiki & Lore Books</p>
    <hr>

    <div class="character-container">
        <!-- ==================== AZARUS ==================== -->
        <a href="./azarus.html" class="char-card" title="Khám phá Azarus">
            <div class="img-box">
                <img src="./sb.jpg" alt="Azarus 🍞" class="char-img">
            </div>
            <span class="char-title">Azarus 🍞</span>
        </a>
        
        <!-- ==================== BH AZARUS ==================== -->
        <a href="./bh-azarus.html" class="char-card bh-card" title="Khám phá BH Azarus">
            <div class="img-box">
                <img src="./sb.jpg" alt="BH Azarus 🌸" class="char-img">
            </div>
            <span class="char-title">BH Azarus 🌸</span>
        </a>
    </div>

</body>
</html>
