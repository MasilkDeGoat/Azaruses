<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaruses</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin-bottom: 40px;
        }

        /* Nút màu đen với hiệu ứng Hover viền hồng */
        .btn-enter {
            display: inline-block;
            background-color: #121212;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        /* Khi rê chuột vào nút */
        .btn-enter:hover {
            border-color: #e91e63;
            color: #f48fb1;
            box-shadow: 0 0 15px rgba(233, 30, 99, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>Azaruses</h1>
    <p class="subtitle">Unofficial Wiki & Lore Books</p>
    <hr>

    <!-- Nút đen dẫn sang file bh-azarus.html -->
