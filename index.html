<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaruses</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin-bottom: 40px;
        }

        .character-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Khung chứa ảnh */
        .char-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 3px solid #e5e5e5;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }

        /* Thẻ ảnh co giãn vừa vặn khung */
        .char-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* Hiệu ứng rê chuột */
        .char-link:hover .char-img {
            transform: scale(1.1);
        }

        .char-link:hover {
            border-color: #1a1a1a;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>Azaruses</h1>
    <p class="subtitle">Unofficial Wiki & Lore Books</p>
    <hr>

    <div class="character-container">
        <a href="./azarus.html" class="char-link" title="Khám phá Azarus">
            <img src="./sb.jpg" alt="Azarus 🍞" class="char-img">
        </a>
    </div>

</body>
</html>
