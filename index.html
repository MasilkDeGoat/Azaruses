<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaruses</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin-bottom: 40px;
        }
        /* THE END OF THE BACKGROUND. DO. NOT. TOUCH. */


        


        /* TIÊU ĐỀ CHO TỪNG SECTION */
        .section-title {
            width: 100%;                  /* Trải dài full màn hình */
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            margin: 40px 0 20px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            clear: both;
        }

        /* KHU VỰC CHỨA CÁC CARD CỦA MỖI SECTION */
        .character-container {
            display: flex;
            flex-direction: row;        /* Nằm ngang chung một hàng */
            flex-wrap: wrap;           /* Tự rớt hàng nếu màn hình điện thoại quá hẹp */
            gap: 25px;                 /* Khoảng cách giữa Lazarus và BH */
            align-items: flex-start;
            width: 100%;
            margin-bottom: 30px;
        }

        /* RIÊNG CHO THE FOUNDER (CĂN GIỮA) */
        .founder-container {
            display: flex;
            justify-content: center;      /* DÒNG NÀY BẮC BUỘC Phải CÓ ĐỂ VÀO GIỮA */
            width: 100%;
            margin-top: 15px;             /* Đẩy card hạ xuống xíu cho đẹp */
            margin-bottom: 30px;
        /* DO. NOT. TOUCH. */




            
        }
        
        /* CARD OF THE CHARACTERS ARE HERE */
        .char-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #1a1a1a;
            width: 260px;                 /* Ảnh to nét căng */
            padding: 0;                   
            border-radius: 0;            
            border: none;                
            background-color: transparent;
            box-shadow: none;            
            transition: all 0.3s ease;
        }

        /* PICTURE IN CARD */
        .img-box {
            width: 100%;                 /* Cho khung ảnh tự co giãn theo chiều rộng card */
            height: auto;                /* Cho chiều cao tự do theo tỉ lệ ảnh Polaroid */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
            border-radius: 0;
            margin-top: 15px;
        }

        .char-img {
            width: 100%;                 /* Ảnh tự ôm trọn 100% độ rộng */
            height: auto;                /* Giữ nguyên tỉ lệ dọc của ảnh Polaroid */
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* CHARACTERS NAME BOTTOM */
        .char-title {
            margin-top: 14px;
            font-size: 1.25rem;
            font-weight: 600;
            color: #121212;
        }

        /* HOVER. HOVER. HOVER */
        .char-card:hover {
            border-color: transparent;   /* Không hiện viền khi rê chuột */
            box-shadow: none;            /* Không hiện bóng khi rê chuột */
            transform: translateY(-4px); /* Vẫn nẩy nhẹ card lên cực mượt */
        }
        
        .char-card:hover .char-img {
            transform: scale(1.05);      /* Phóng to nhẹ riêng bức ảnh */
        }

        
        
        /* IMAGE HOVER DO. NOT. TOUCH. */
        .img-hov {
            display: none;
        }

        .char-card:hover .img-nor {
            display: none;
        }

        .char-card:hover .img-hov {
            display: block;
        }
    </style>
        
</head>




    
<body>
    



    
    <h1>Azaruses</h1>
    <p class="subtitle">Unofficial Wiki & Lore Books</p>
    <hr>

    <div class="character-container">

        <!-- ================= SECTION 1: THE FOUNDER ================= -->
        <h2 class="section-title">The Founder</h2>
        <div class="founder-container">
            
            <!-- ==================== AZARUS ==================== -->
            <a href="./azarus.html" class="char-card azarus-card" title="Khám phá Azarus">
                <div class="img-box"> 
                    <img src="./aza_nor.png" alt="Azarus Normal" class="char-img img-nor">
                    <img src="./aza_hov.png" alt="Azarus Hover" class="char-img img-hov">
                </div>
                <span class="char-title">Azarus 🍞</span>
            </a>
        </div>



        
        
        <!-- ================= SECTION 2: THE GROUP MEMBERS ================= -->
        <h2 class="section-title">The Group Members</h2>
        <div class="character-container">

        <!-- ==================== LAZARUS ==================== -->
            <a href="./lazarus.html" class="char-card la-card" title="Learn More ABout Lazarus">
                <div class="img-box">
                    <img src="./aza_nor.png" alt="Azarus Normal" class="char-img img-nor">
                    <img src="./aza_hov.png" alt="Azarus Hover" class="char-img img-hov">
                </div>
                <span class="char-title">Lazarus 🦇</span>
            </a>
            
        <!-- ==================== BH AZARUS ==================== -->
            <a href="./bh-azarus.html" class="char-card bh-card" title="Learn More ABout BH Azarus">
                <div class="img-box">
                    <img src="./aza_nor.png" alt="Azarus Normal" class="char-img img-nor">
                    <img src="./aza_hov.png" alt="Azarus Hover" class="char-img img-hov">
                </div>
                <span class="char-title">BH Azarus 🌸</span>
            </a>
        </div>
        



        
        <!-- ================= SECTION 3: ENEMY ================= -->
        <h2 class="section-title">Enemy</h2>
        <div class="character-container">
            
        <!-- ==================== VOID AZARUS ==================== -->
            <a href="./void-azarus.html" class="char-card void-card" title="Learn More ABout Void Azarus">
                <div class="img-box">
                    <img src="./aza_nor.png" alt="Azarus Normal" class="char-img img-nor">
                    <img src="./aza_hov.png" alt="Azarus Hover" class="char-img img-hov">
                </div>
                <span class="char-title">VOID Azarus ☠️</span>
            </a>
        </div>


        <!-- ================= SECTION 4: SIDE CHARACTERS ================= -->
        <h2 class="section-title">Side Characters</h2>
        <div class="character-container">

</body>
</html>
