<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azarus - Lore Book</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background-color: #ffffff;
            color: #1a1a1a;
            max-width: 800px;
        }

        /* BACK TO THE MAIN PAGE BUTTON */
        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            color: #1a1a1a;
            border-color: #E9BD96;
            background-color: #fff8f3;
        }

        /* CARD FOR CHARACTER */
        .profile-header {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-bottom: 30px;
        }

        /* PFP IN THE CARD */
        .big-avatar {
            width: 220px;
            height: auto;                     /* Chiều cao tự do theo dáng ảnh */
            border-radius: 0;                 /* Bỏ bo góc khung ngoài */
            border: none;                     /* BỎ VIỀN CAM */
            overflow: visible;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: none;                 /* BỎ BÓNG MỜ KHUNG */
            flex-shrink: 0;
        }

        .big-avatar img {
            width: 100%;                      /* Cho ảnh ôm vừa độ rộng 220px */
            height: auto;                     /* Giữ nguyên tỉ lệ dọc Polaroid */
            object-fit: contain;
        }

        
        .profile-info h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
        }

        .profile-info .tag {
            display: inline-block;
            background-color: #f3f3f3;
            color: #555;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin: 30px 0;
        }

        /* THE BODY / Lore */
        .content-section {
            line-height: 1.7;
            color: #333;
        }

        .content-section h2 {
            font-size: 1.4rem;
            color: #1a1a1a;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <!-- BUTTON TO BACK TO THE MAIN PAGE -->
    <a href="index.html" class="back-btn">← Back To The Main Page</a>

    <!-- PROFILE CHARACTERER -->
    <div class="profile-header">
        <div class="big-avatar">
            <!-- THE PFP -->
            <img src="aza_nor.png" alt="Lazarus">
        </div>
        <div class="profile-info">
            <h1> Lazarus 🦇</h1>
            <span class="tag">Character Lore</span>
            <p>Yo this is a cool as qoute.</p>
        </div>
    </div>

    <hr>

    <!-- DETAILS BODY / Story -->
    <div class="content-section">
        <h2>Introduce</h2>
        <p>Lore and Lore, don't know what else lol</p>

        <h2>Rumor & Lore</h2>
        <p>Will have to write his badass lore here</p>
    </div>

</body>
</html>
