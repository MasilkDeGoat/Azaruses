<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Azarus - Azaruses Wiki</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #ffffff; /* Viền trắng */
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25); /* Phát sáng trắng mờ */
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        p {
            color: #cccccc;
            font-style: italic;
        }
        a.back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        a.back-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Azarus</h1>
        <p>"I love bread. We bleed bread. We're bread."</p>
        <a href="./index.html" class="back-btn">&larr; Quay lại trang chủ</a>

</body>
</html>
